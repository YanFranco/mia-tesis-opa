# =============================================================================
# DATA MAPPING - CGR INFOBRAS (Obras Públicas)
# describe QUÉ se mapea y QUÉ reglas se aplican,
# Los tipos lógicos marcados como "inferido" se deducen del nombre/reglas del
# pipeline y deben validarse contra el DDL real.
# =============================================================================

mapping:
  id: map_cgr_infobras_obras_publicas
  version: "1.0.0"
  status: draft                    # draft | approved | deprecated
  owner: yanfranco.cf@gmail.com
  created: 2026-11-09
  description: >
    Mapeo de la hoja principal del dataset de obras públicas de INFOBRAS
    (Contraloría General de la República, Perú) hacia la tabla de staging
    "sa_obras_publicas_infobras". Cada archivo representa una "foto"
    (snapshot) del estado de las obras a una fecha.

# -----------------------------------------------------------------------------
# ORIGEN
# -----------------------------------------------------------------------------
source:
  system: CGR - INFOBRAS
  type: file
  format: xlsx
  location_pattern: "data/raw/cgr/opublicas/DataSet-Obras-Publicas*.xlsx"
  sheet: first                      # primera hoja del libro
  header_row: 1
  encoding: utf-8
  granularity: "1 fila = 1 registro de obra (con su último avance reportado) por snapshot"
  snapshot_date_extraction:
    from: file_name
    pattern: 'DataSet-Obras-Publicas\s+(\d{2})-(\d{2})-(\d{4})\.xlsx'
    format: "DD-MM-YYYY"
    example: "DataSet-Obras-Publicas 07-11-2025.xlsx"
    on_failure: skip_file           # el archivo se omite y se registra error
  duplicate_headers:
    note: >
      Existen encabezados repetidos en el origen. Se resuelven por POSICIÓN
      (ocurrencia 1, 2, ...) y no por nombre. Ver campo source_occurrence.
    affected:
      - "RUC"
      - "Nombre o razón social de la empresa o consorcio"
      - "Monto del contrato  en soles"
      - "Tipo de documento de identidad"
      - "Número de documento"
      - "Nombres Apellidos"
      - "Colegiatura"
      - "Número de colegiatura"

# -----------------------------------------------------------------------------
# DESTINO
# -----------------------------------------------------------------------------
target:
  layer: staging                    # staging | curated | mart
  schema: public
  entity: sa_obras_publicas_infobras
  natural_key_candidate: [codigo_infobras, fecha_foto, ano_avance, mes_avance]
  natural_key_status: "por validar (no definido en el pipeline actual)"
  naming_convention: snake_case_es
  flag_prefix: "flg_"
  count_prefix: "n_"

# -----------------------------------------------------------------------------
# ESTRATEGIA DE CARGA
# -----------------------------------------------------------------------------
load:
  strategy: snapshot_replace        # reemplazo idempotente por partición lógica
  partition_key: fecha_foto
  steps:
    - "Eliminar registros del destino con fecha_foto = fecha del archivo"
    - "Insertar registros transformados en lotes"
  batch_size: 1000
  idempotent: true
  atomicity: per_batch
  on_batch_error: retry_row_by_row  # aísla filas defectuosas
  error_handling:
    reject_policy: log_and_continue
    log_fields: [column, value, python_type, error_message]
  unmapped_columns_policy:
    source_missing_column: warn_and_load_null
    target_missing_column: warn_and_skip
  observations:
    - "El DELETE y los INSERT usan commits distintos: un fallo intermedio deja el snapshot parcial. Recomendable envolver en una única transacción o usar tabla temporal + swap."

# -----------------------------------------------------------------------------
# CONVENCIONES GLOBALES
# -----------------------------------------------------------------------------
conventions:
  null_representation: NULL         # NaN / vacío / no parseable -> NULL
  boolean_true_values:  [si, sí, s, "1", true, t, y, yes]
  boolean_false_values: [no, "0", false, f, n]
  boolean_unknown: NULL
  date_input_format: "dayfirst (dd/mm/yyyy)"
  date_unparseable: NULL
  decimal_separator_output: "."
  integer_out_of_range: NULL
  integer_non_integral: NULL

# -----------------------------------------------------------------------------
# TRANSFORMACIONES REUTILIZABLES
# -----------------------------------------------------------------------------
transformations:
  - id: TRF_NONE
    description: "Copia directa sin modificación."
  - id: TRF_AMOUNT_SPACE_TO_DECIMAL
    description: >
      Normaliza números cuyo separador decimal viene como espacio
      (ej. "1205065 23" -> 1205065.23; "S/1 002 000 00" -> 1002000.00).
    rules:
      - "Si ya es numérico: se conserva."
      - "Vacío/nulo -> NULL."
      - "Eliminar prefijo 'S/' (insensible a mayúsculas)."
      - "El ÚLTIMO espacio es el separador decimal; los demás espacios y comas son separadores de miles y se eliminan."
      - "Sin espacios: eliminar comas y convertir."
      - "Si falla la conversión -> NULL + warning."
    output_type: decimal
  - id: TRF_DATE_DAYFIRST
    description: "Parseo a fecha con día primero; valores inválidos -> NULL."
    output_type: date
  - id: TRF_BOOLEAN_SI_NO
    description: "Mapeo de Sí/No (y variantes) a booleano según conventions."
    output_type: boolean
  - id: TRF_INTEGER_STRICT
    description: >
      Limpia espacios/comas, acepta solo enteros (o flotantes enteros) dentro
      del rango del tipo destino; en otro caso NULL.
    output_type: integer
  - id: TRF_FORCE_STRING
    description: "Fuerza tipo texto (preserva ceros a la izquierda / evita inferencia numérica)."
    output_type: string

# -----------------------------------------------------------------------------
# COLUMNAS DE AUDITORÍA / LINAJE (generadas, no provienen del Excel)
# -----------------------------------------------------------------------------
audit_columns:
  - target: fecha_foto
    type: date
    nullable: false
    derivation: "Fecha extraída del nombre del archivo (source.snapshot_date_extraction)."
    description: "Fecha lógica del snapshot; clave de partición y de reemplazo."
  - target: nombre_archivo
    type: string
    nullable: false
    derivation: "Nombre del archivo fuente."
    description: "Linaje: archivo de origen."
  - target: fecha_creacion
    type: timestamp
    nullable: false
    derivation: "DEFAULT en la base de datos (now)."
    description: "Momento de carga."
  - target: usuario_creacion
    type: string
    nullable: false
    derivation: "DEFAULT en la base de datos (current_user)."
    description: "Usuario que ejecutó la carga."

# -----------------------------------------------------------------------------
# MAPEO DE COLUMNAS
# Campos: source (encabezado Excel), source_occurrence (si está repetido),
#         target, type (lógico), nullable, transform, description
# Tipos: string | integer | decimal | boolean | date
# -----------------------------------------------------------------------------
column_groups:

  - group: identificacion_entidad_obra
    description: "Identificación de la entidad y de la obra."
    columns:
      - {source: "codigo Entidad", target: codigo_entidad, type: string, nullable: true, transform: TRF_FORCE_STRING, description: "Código de la entidad pública."}
      - {source: "Entidad Pública", target: entidad_publica, type: string, nullable: true, transform: TRF_NONE, description: "Nombre de la entidad pública."}
      - {source: "Código INFOBRAS", target: codigo_infobras, type: string, nullable: true, transform: TRF_NONE, description: "Código único de la obra en INFOBRAS (inferido como identificador de negocio)."}
      - {source: "Nombre de obra", target: nombre_obra, type: string, nullable: true, transform: TRF_NONE, description: "Denominación de la obra."}
      - {source: "Modalidad de ejecución de la obra", target: modalidad_ejecucion_obra, type: string, nullable: true, transform: TRF_NONE, description: "Modalidad (contrata, administración directa, etc.)."}
      - {source: "¿Corresponde a un saldo de Obra?", target: flg_corresponde_saldo_obra, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Indica si la obra es un saldo de obra."}
      - {source: "Código INFOBRAS de obra inicial", target: codigo_infobras_obra_inicial, type: string, nullable: true, transform: TRF_NONE, description: "Código de la obra original cuando es saldo de obra."}
      - {source: "Naturaleza de la obra", target: naturaleza_obra, type: string, nullable: true, transform: TRF_NONE, description: "Naturaleza de la intervención."}

  - group: clasificacion_marcas
    description: "Clasificación de la obra y marcas especiales."
    columns:
      - {source: "Tipo de obra - Clasificador Nivel 1", target: tipo_obra_nivel_1, type: string, nullable: true, transform: TRF_NONE, description: "Clasificación jerárquica de tipo de obra, nivel 1."}
      - {source: "Tipo de obra - Clasificador Nivel 2", target: tipo_obra_nivel_2, type: string, nullable: true, transform: TRF_NONE, description: "Clasificación nivel 2."}
      - {source: "Tipo de obra - Clasificador Nivel 3", target: tipo_obra_nivel_3, type: string, nullable: true, transform: TRF_NONE, description: "Clasificación nivel 3."}
      - {source: "Estado de ejecución", target: estado_ejecucion, type: string, nullable: true, transform: TRF_NONE, description: "Estado de ejecución de la obra."}
      - {source: "Marca Reconstrucción con Cambios (Si/No)", target: flg_reconstruccion_con_cambios, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Obra marcada como Reconstrucción con Cambios."}
      - {source: "Marca Reactivación Economicas (Si/No)", target: flg_reactivacion_economica, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Obra marcada como Reactivación Económica."}
      - {source: "Otra Marca", target: otra_marca, type: string, nullable: true, transform: TRF_NONE, description: "Otras marcas asignadas."}

  - group: control_social_y_fiscalizacion
    description: "Contadores de participación ciudadana y control."
    columns:
      - {source: "N° Informes de Monitores Ciudadanos", target: n_informes_monitores_ciudadanos, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de informes de monitores ciudadanos."}
      - {source: "N° Denuncias vinculadas", target: n_denuncias_viculadas, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de denuncias vinculadas. NOTA: nombre destino con typo ('viculadas'), se conserva por compatibilidad."}
      - {source: "N° Informes de control", target: n_informes_control, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de informes de control."}
      - {source: "N° Comentarios ciudadanos", target: n_comentarios_ciudadanos, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de comentarios ciudadanos."}
      - {source: "¿Es una obra de carácter reservado?", target: flg_obra_caracter_reservado, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Obra de carácter reservado."}

  - group: entidad_y_proyecto_inversion
    description: "Contexto institucional y proyecto de inversión asociado."
    columns:
      - {source: "Nivel de gobierno", target: nivel_gobierno, type: string, nullable: true, transform: TRF_NONE, description: "Nacional, regional o local."}
      - {source: "Sector de la Entidad", target: sector_entidad, type: string, nullable: true, transform: TRF_NONE, description: "Sector de la entidad."}
      - {source: "Codigo unico de inversión", target: codigo_unico, type: string, nullable: true, transform: TRF_NONE, description: "Código Único de Inversiones (Invierte.pe)."}
      - {source: "Código SNIP", target: codigo_snip, type: string, nullable: true, transform: TRF_NONE, description: "Código SNIP del proyecto."}
      - {source: "Nombre proyecto", target: nombre_proyecto, type: string, nullable: true, transform: TRF_NONE, description: "Nombre del proyecto de inversión."}
      - {source: "Estado del proyecto", target: estado_proyecto, type: string, nullable: true, transform: TRF_NONE, description: "Estado del proyecto."}
      - {source: "Tipo Formato", target: tipo_formato, type: string, nullable: true, transform: TRF_NONE, description: "Tipo de formato de inversión."}
      - {source: "Monto Viable/Aprobado", target: monto_viable_aprobado, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto viable/aprobado del proyecto."}
      - {source: "Fecha de aprobación", target: fecha_aprobacion, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de aprobación de viabilidad."}
      - {source: "Monto Viable actualizado", target: monto_viable_actualizado, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto viable actualizado."}
      - {source: "Fecha de actualización", target: fecha_actualizacion, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de actualización del monto viable."}
      - {source: "N° obras relacionadas al proyecto", target: n_obras_relacionadas_proyecto, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Número de obras asociadas al mismo proyecto."}

  - group: ubicacion
    description: "Ubicación geográfica."
    columns:
      - {source: "Departamento", target: departamento, type: string, nullable: true, transform: TRF_NONE, description: "Departamento."}
      - {source: "Provincia", target: provincia, type: string, nullable: true, transform: TRF_NONE, description: "Provincia."}
      - {source: "Distrito", target: distrito, type: string, nullable: true, transform: TRF_NONE, description: "Distrito."}
      - {source: "Dirección o información de referencia", target: direccion_informacion_referencia, type: string, nullable: true, transform: TRF_NONE, description: "Dirección o referencia de ubicación."}
      - {source: "Tipo de ubicación (exacta/referencial)", target: tipo_ubicacion, type: string, nullable: true, transform: TRF_NONE, description: "Exacta o referencial."}

  - group: expediente_tecnico
    description: "Aprobación del expediente técnico."
    columns:
      - {source: "Fecha de aprobación del expediente", target: fecha_aprobacion_expediente, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de aprobación del expediente técnico."}
      - {source: "Monto de aprobación de expediente técnico", target: monto_aprobacion_et, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, description: "Monto del expediente técnico en la moneda indicada."}
      - {source: "Moneda", target: moneda, type: string, nullable: true, transform: TRF_NONE, description: "Moneda del monto del expediente."}
      - {source: "Tasa de cambio", target: tasa_cambio, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, description: "Tasa de cambio aplicada a soles."}
      - {source: "Monto aprobado en soles", target: monto_aprobado_soles, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto del expediente convertido a soles."}
      - {source: "Documento de aprobación de expediente", target: documento_aprobacion_expediente, type: string, nullable: true, transform: TRF_NONE, description: "Documento que aprueba el expediente."}

  - group: contratista
    description: "Empresas o consorcios contratistas (hasta 2 ocurrencias)."
    columns:
      - {source: "RUC", source_occurrence: 1, target: ruc_1, type: string, nullable: true, transform: TRF_NONE, description: "RUC del contratista 1."}
      - {source: "Nombre o razón social de la empresa o consorcio", source_occurrence: 1, target: razon_social_empresa_consorcio_1, type: string, nullable: true, transform: TRF_NONE, description: "Razón social del contratista 1."}
      - {source: "Monto del contrato  en soles", source_occurrence: 1, target: monto_contrato_soles_1, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto de contrato 1."}
      - {source: "RUC", source_occurrence: 2, target: ruc_2, type: string, nullable: true, transform: TRF_NONE, description: "RUC del contratista 2."}
      - {source: "Nombre o razón social de la empresa o consorcio:", source_occurrence: 2, target: razon_social_empresa_consorcio_2, type: string, nullable: true, transform: TRF_NONE, description: "Razón social del contratista 2 (el encabezado origen termina en ':')."}
      - {source: "Monto del contrato  en soles", source_occurrence: 2, target: monto_contrato_soles_2, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto de contrato 2."}

  - group: supervision
    description: "Profesional/empresa a cargo de la supervisión (ocurrencia 1; inferido por las fechas de supervisión)."
    columns:
      - {source: "Tipo de documento de identidad", source_occurrence: 1, target: tipo_documento_identidad, type: string, nullable: true, transform: TRF_NONE, pii: true, description: "Tipo de documento del supervisor."}
      - {source: "Número de documento", source_occurrence: 1, target: numero_documento_identidad, type: string, nullable: true, transform: TRF_NONE, pii: true, description: "Número de documento del supervisor."}
      - {source: "Nombres Apellidos", source_occurrence: 1, target: nombres_apellidos, type: string, nullable: true, transform: TRF_NONE, pii: true, description: "Nombre del supervisor."}
      - {source: "Colegiatura", source_occurrence: 1, target: colegiatura, type: string, nullable: true, transform: TRF_NONE, description: "Colegio profesional."}
      - {source: "Número de colegiatura", source_occurrence: 1, target: numero_colegiatura, type: string, nullable: true, transform: TRF_NONE, description: "Número de colegiatura."}
      - {source: "Fecha inicio supervision", target: fecha_inicio_supervision, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Inicio de la supervisión."}
      - {source: "Fecha fin supervision", target: fecha_fin_supervision, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fin de la supervisión."}

  - group: residente_inspector
    description: "Segundo profesional con fechas de labores (ocurrencia 2; inferido, probablemente residente/inspector)."
    columns:
      - {source: "Tipo de documento de identidad", source_occurrence: 2, target: tipo_documento_identidad_2, type: string, nullable: true, transform: TRF_NONE, pii: true, description: "Tipo de documento."}
      - {source: "Número de documento", source_occurrence: 2, target: numero_documento_identidad_2, type: string, nullable: true, transform: TRF_NONE, pii: true, description: "Número de documento."}
      - {source: "Nombres Apellidos", source_occurrence: 2, target: nombres_apellidos_2, type: string, nullable: true, transform: TRF_NONE, pii: true, description: "Nombre del profesional."}
      - {source: "Colegiatura", source_occurrence: 2, target: colegiatura_2, type: string, nullable: true, transform: TRF_NONE, description: "Colegio profesional."}
      - {source: "Número de colegiatura", source_occurrence: 2, target: numero_colegiatura_2, type: string, nullable: true, transform: TRF_NONE, description: "Número de colegiatura."}
      - {source: "Fecha inicio de labores", target: fecha_inicio_labores, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Inicio de labores."}
      - {source: "Fecha fin  de labores", target: fecha_fin_labores, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fin de labores."}

  - group: plazos_y_entrega_terreno
    description: "Plazos programados y entrega del terreno."
    columns:
      - {source: "Fecha de inicio de obra", target: fecha_inicio_obra, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Inicio de obra."}
      - {source: "Fecha finalización programada de obra", target: fecha_fin_programada_obra, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fin programado."}
      - {source: "Plazo de ejecución (en dias)", target: plazo_ejecucion_dias, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, unit: days, description: "Plazo original de ejecución."}
      - {source: "Tipo de entrega", target: tipo_entrega, type: string, nullable: true, transform: TRF_NONE, description: "Total o parcial."}
      - {source: "Porcentaje de terreno entregado", target: porcentaje_terreno_entregado, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: percent, description: "% de terreno entregado."}
      - {source: "Fecha de entrega del terreno", target: fecha_entrega_terreno, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de entrega del terreno."}

  - group: avance_fisico_financiero
    description: "Último registro de avance reportado."
    columns:
      - {source: "Año de avance", target: ano_avance, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Año del avance (inferido)."}
      - {source: "Mes de avance", target: mes_avance, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Mes del avance (inferido; 1-12)."}
      - {source: "Fecha de registro de avance", target: fecha_registro_avance, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha en que se registró el avance."}
      - {source: "Avance Físico Programado Acumulado (%)", target: avance_fisico_programado_acumulado, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: percent, description: "Avance físico programado acumulado."}
      - {source: "Avance Físico Real Acumulado (%)", target: avance_fisico_real_acumulado, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: percent, description: "Avance físico real acumulado."}
      - {source: "Monto de valorización Programado Acumulado", target: monto_valorizacion_programado_acum, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Valorización programada acumulada."}
      - {source: "Monto de valorización Ejecutado Acumulado", target: monto_valorizacion_ejecutado_acum, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Valorización ejecutada acumulada."}
      - {source: "Porcentaje de ejecución financiera", target: porcentaje_ejecucion_financiera, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: percent, description: "% de ejecución financiera."}
      - {source: "Monto de ejecución financiera de la obra", target: monto_ejecucion_financiera_obra, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto de ejecución financiera."}
      - {source: "Estado de actualización de registro de avance", target: estado_actualizacion_registro_avance, type: string, nullable: true, transform: TRF_NONE, description: "Estado de actualización del registro de avance."}
      - {source: "Comentarios", target: comentarios, type: string, nullable: true, transform: TRF_NONE, description: "Comentarios libres del registro de avance."}

  - group: paralizacion
    description: "Paralización de la obra."
    columns:
      - {source: "Existe Paralización", target: flg_existe_paralizacion, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Indica si existe paralización."}
      - {source: "Causal de paralización", target: causal_paralizacion, type: string, nullable: true, transform: TRF_NONE, description: "Causal de la paralización."}
      - {source: "Fecha de paralización", target: fecha_paralizacion, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de paralización."}
      - {source: "Número de dias paralizado", target: numero_dias_paralizado, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, unit: days, description: "Días de paralización."}

  - group: certificacion_presupuestal
    description: "Certificados de inversión pública (CIPRIL/CIPGN)."
    columns:
      - {source: "Tipo de certificado de inversión pública", target: tipo_certificado_inversion_publica, type: string, nullable: true, transform: TRF_NONE, description: "Tipo de certificado."}
      - {source: "Número del CIPRIL /CIPGN", target: numero_cipril_cipgn, type: string, nullable: true, transform: TRF_NONE, description: "Número de certificado."}
      - {source: "Fecha del CIPRIL / CIPGN", target: fech_cipril_cipgn, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha del certificado. NOTA: nombre destino abreviado ('fech_'), se conserva por compatibilidad."}
      - {source: "Monto CIPRIL / CIPGN", target: monto_cipril_cipgn, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto del certificado."}

  - group: modificaciones_adicionales_deductivos
    description: "Modificaciones de plazo/monto, controversias, adicionales y deductivos."
    columns:
      - {source: "N° de modificaciones", target: n_modificaciones, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de modificaciones."}
      - {source: "N° días de modificaciones de plazo", target: n_dias_modificaciones_plazo, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, unit: days, description: "Días acumulados de ampliación de plazo."}
      - {source: "Nuevo Plazo de ejecución (en dias)", target: nuevo_plazo_ejecucion_dias, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, unit: days, description: "Plazo vigente tras modificaciones."}
      - {source: "Fecha finalización reprogramada de obra", target: fecha_finalizacion_reprogramada_obra, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fin reprogramado."}
      - {source: "N° de controversias", target: n_controversias, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de controversias."}
      - {source: "N° de adicionales de obra", target: n_adicionales_obra, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de adicionales de obra."}
      - {source: "Monto de adicionales de obra en soles", target: monto_adicionales_obra_soles, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto de adicionales de obra."}
      - {source: "N° de adicionales de supervisión", target: n_adicionales_supervision, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de adicionales de supervisión."}
      - {source: "Monto de adicionales de supervisión en soles", target: monto_adicionales_supervision_soles, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto de adicionales de supervisión."}
      - {source: "N° de deductivos de obra", target: n_deductivos_obra, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de deductivos de obra."}
      - {source: "Monto de deductivos de obra en soles", target: monto_deductivo_obra_soles, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto de deductivos de obra."}
      - {source: "N° de deductivos de supervisión", target: n_deductivo_supervision, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Cantidad de deductivos de supervisión."}
      - {source: "Monto de deductivos de supervisión en soles", target: monto_deductivos_supervision_soles, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto de deductivos de supervisión."}

  - group: cierre_liquidacion_transferencia
    description: "Finalización, recepción, liquidación y transferencia."
    columns:
      - {source: "Fecha de finalización real", target: fecha_finalizacion_real, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha real de finalización."}
      - {source: "Motivo en caso no se llegue al 100%", target: motivo_caso_no_llegue_100_porciento, type: string, nullable: true, transform: TRF_NONE, description: "Motivo si no se alcanza 100% de avance."}
      - {source: "¿Tiene recepción total?", target: flg_tiene_recepcion_total, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Recepción total de la obra."}
      - {source: "Fecha de recepción", target: fecha_recepcion, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de recepción."}
      - {source: "¿Tiene liquidación de obra?", target: flg_tiene_liquidacion_obra, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Existe liquidación de obra."}
      - {source: "Fecha de aprobación de liquidación de obra", target: fecha_aprobacion_liquidacion_obra, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de aprobación de la liquidación."}
      - {source: "Costo de la obra en soles", target: costo_obra_soles, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Costo final de la obra."}
      - {source: "¿Corresponde la transferencia  a otra entidad?", target: flg_corresponde_transferencia_otra_entidad, type: boolean, nullable: true, transform: TRF_BOOLEAN_SI_NO, description: "Se transfiere a otra entidad."}
      - {source: "Fecha de transferencia", target: fecha_transferencia, type: date, nullable: true, transform: TRF_DATE_DAYFIRST, description: "Fecha de transferencia."}
      - {source: "Tipo de entidad que recepciona la obra", target: tipo_entidad_recepciona_obra, type: string, nullable: true, transform: TRF_NONE, description: "Tipo de entidad receptora."}

  - group: devengado
    description: "Ejecución presupuestal devengada."
    columns:
      - {source: "Año de primer devengado", target: ano_primer_devengado, type: integer, nullable: true, transform: TRF_INTEGER_STRICT, description: "Año del primer devengado."}
      - {source: "Monto Total devengado del proyecto", target: monto_total_devengado_proyecto, type: decimal, nullable: true, transform: TRF_AMOUNT_SPACE_TO_DECIMAL, unit: PEN, description: "Monto total devengado del proyecto."}

# -----------------------------------------------------------------------------
# REGLAS DE CALIDAD DE DATOS (propuestas; el pipeline actual no las aplica)
# -----------------------------------------------------------------------------
data_quality:
  severity_levels: [error, warning, info]
  rules:
    - {id: DQ001, target: codigo_infobras, rule: not_null, severity: error}
    - {id: DQ002, target: fecha_foto, rule: not_null, severity: error}
    - {id: DQ003, target: [codigo_infobras, fecha_foto, ano_avance, mes_avance], rule: unique, severity: warning, note: "Validar grano real antes de imponer"}
    - {id: DQ004, target: mes_avance, rule: range, min: 1, max: 12, severity: warning}
    - {id: DQ005, target: [avance_fisico_programado_acumulado, avance_fisico_real_acumulado, porcentaje_ejecucion_financiera, porcentaje_terreno_entregado], rule: range, min: 0, max: 100, severity: warning}
    - {id: DQ006, target: [fecha_inicio_obra, fecha_fin_programada_obra], rule: "fecha_inicio_obra <= fecha_fin_programada_obra", severity: warning}
    - {id: DQ007, target: [monto_aprobacion_et, moneda, tasa_cambio, monto_aprobado_soles], rule: "monto_aprobado_soles consistente con monto_aprobacion_et * tasa_cambio cuando moneda != PEN", severity: info}
    - {id: DQ008, target: "columnas con transformación TRF_*", rule: "tasa de NULLs por conversión fallida <= umbral", threshold_pct: 1, severity: warning}
    - {id: DQ009, target: [ruc_1, ruc_2], rule: "longitud = 11 y solo dígitos", severity: warning}
    - {id: DQ010, target: "*_soles, monto_*", rule: "valor >= 0 (excepto deductivos según semántica)", severity: info}
  reconciliation:
    - "filas_origen == filas_insertadas + filas_rechazadas"
    - "conteo por fecha_foto en destino == filas del archivo"

# -----------------------------------------------------------------------------
# GOBIERNO Y SEGURIDAD
# -----------------------------------------------------------------------------
governance:
  data_classification: public_government_open_data
  pii_columns: [tipo_documento_identidad, numero_documento_identidad, nombres_apellidos, tipo_documento_identidad_2, numero_documento_identidad_2, nombres_apellidos_2]
  pii_note: "Datos de profesionales publicados por la fuente; aplicar enmascaramiento si se exponen fuera del uso académico."
  lineage: [fecha_foto, nombre_archivo, fecha_creacion, usuario_creacion]
  retention: "Sin definir; se conservan todos los snapshots (partición por fecha_foto)."

# -----------------------------------------------------------------------------
# HALLAZGOS / DEUDA TÉCNICA DETECTADA EN EL PIPELINE ACTUAL
# -----------------------------------------------------------------------------
findings:
  - id: F001
    severity: high
    title: "Encabezados duplicados colapsados"
    detail: >
      El mapping markdown se carga como diccionario clave=encabezado, por lo que
      las claves repetidas (RUC, Monto del contrato en soles, Tipo de documento,
      etc.) se sobrescriben y solo sobrevive la última (ruc_2, monto_contrato_soles_2,
      tipo_documento_identidad_2...). Además, al leer el Excel, el motor suele
      renombrar duplicados ("RUC.1"). Resolver por posición (source_occurrence).
  - id: F002
    severity: medium
    title: "Encabezado inconsistente"
    detail: "'Nombre o razón social de la empresa o consorcio:' (con dos puntos) solo en la ocurrencia 2."
  - id: F003
    severity: medium
    title: "Detección de fechas por subcadena"
    detail: "Se detecta 'fecha' en el nombre de columna; este mapping la declara explícitamente con type: date."
  - id: F004
    severity: medium
    title: "Carga no atómica"
    detail: "Ver load.observations."
  - id: F005
    severity: low
    title: "Typos en nombres destino"
    detail: "n_denuncias_viculadas, fech_cipril_cipgn. Renombrar en la capa curated."
  - id: F006
    severity: low
    title: "Tipos no explícitos en el mapping original"
    detail: "El .md no declara tipos; aquí son inferidos y deben conciliarse con el DDL."
