data_quality:
  severity_levels:
  - error
  - warning
  - info
  rules:
  - id: DQ001
    target: codigo_infobras
    rule: not_null
    severity: error
  - id: DQ002
    target: fecha_foto
    rule: not_null
    severity: error
  - id: DQ003
    target:
    - codigo_infobras
    - fecha_foto
    - ano_avance
    - mes_avance
    rule: unique
    severity: warning
    note: Validar grano real antes de imponer
  - id: DQ004
    target: mes_avance
    rule: range
    min: 1
    max: 12
    severity: warning
  - id: DQ005
    target:
    - avance_fisico_programado_acumulado
    - avance_fisico_real_acumulado
    - porcentaje_ejecucion_financiera
    - porcentaje_terreno_entregado
    rule: range
    min: 0
    max: 100
    severity: warning
  - id: DQ006
    target:
    - fecha_inicio_obra
    - fecha_fin_programada_obra
    rule: fecha_inicio_obra <= fecha_fin_programada_obra
    severity: warning
  - id: DQ007
    target:
    - monto_aprobacion_et
    - moneda
    - tasa_cambio
    - monto_aprobado_soles
    rule: monto_aprobado_soles consistente con monto_aprobacion_et * tasa_cambio cuando moneda != PEN
    severity: info
  - id: DQ008
    target: columnas con transformación TRF_*
    rule: tasa de NULLs por conversión fallida <= umbral
    threshold_pct: 1
    severity: warning
  - id: DQ009
    target:
    - ruc_1
    - ruc_2
    rule: longitud = 11 y solo dígitos
    severity: warning
  - id: DQ010
    target: '*_soles, monto_*'
    rule: valor >= 0 (excepto deductivos según semántica)
    severity: info
  reconciliation:
  - filas_origen == filas_insertadas + filas_rechazadas
  - conteo por fecha_foto en destino == filas del archivo
governance:
  data_classification: public_government_open_data
  pii_columns:
  - nombres_apellidos
  - nombres_apellidos_2
  pii_note: Datos de profesionales publicados por la fuente; aplicar enmascaramiento si se exponen fuera del uso
    académico.
  lineage:
  - fecha_foto
  - nombre_archivo
  - fecha_creacion
  - usuario_creacion
  retention: Sin definir; se conservan todos los snapshots (partición por fecha_foto).
findings:
- id: F201
  severity: high
  title: Identificación de ejecución y supervisión
  detail: Las posiciones 41-43 corresponden a ejecución y 44-46 a supervisión. Los destinos históricos con sufijo
    2 se conservan provisionalmente; validar su significado.
- id: F202
  severity: high
  title: Datos ausentes y campos nuevos
  detail: Los destinos sin origen están listados en unavailable_target_columns. Las veedurías y el costo actualizado
    de inversión no tienen destino confirmado y requieren validación de DDL.
- id: F203
  severity: medium
  title: Encabezado repetido de monto
  detail: La segunda columna de monto aparece con sufijo .1 en pandas. Usar posición 46 y comprobar el encabezado
    físico; no confundir con ejecución en posición 43.
- id: F204
  severity: medium
  title: Campos de equivalencia propuesta
  detail: Las equivalencias marcadas en las columnas son hipótesis de negocio, no validaciones. Revisar también
    tipos y disponibilidad de destinos contra el DDL.
- id: F205
  severity: medium
  title: Perfil limitado a una foto
  detail: El perfil reporta 191180 filas y 97 columnas. La vigencia desde 2026-07-01 se basa en la fecha indicada;
    verificar estructura en fotografías posteriores.
- id: F206
  severity: medium
  title: Conversión de identificadores y montos
  detail: 'Identificadores numéricos con nulos se observan como float en pandas: al convertir a texto quitar solo
    el sufijo decimal .0 de valores enteros sin perder precisión. Validar la regla de espacios en importes y registrar
    conversiones fallidas.'
