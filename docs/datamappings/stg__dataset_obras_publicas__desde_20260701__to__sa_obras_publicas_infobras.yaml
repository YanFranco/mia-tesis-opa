# DATA MAPPING - estructura INFOBRAS vigente desde 2026-07-01
# Basado en el mapping anterior y el profiling proporcionado.
mapping:
  id: map_cgr_infobras_obras_publicas_desde_20260701
  version: 2.0.0
  status: draft
  owner: yanfranco.cf@gmail.com
  created: '2026-11-16'
  description: Mapeo propuesto de la estructura de INFOBRAS observada en la foto del 01-07-2026 hacia sa_obras_publicas_infobras.
    Los destinos y la carga requieren validación contra el DDL y el ETL.
source:
  system: CGR - INFOBRAS
  type: file
  format: xlsx
  location_pattern: data/raw/cgr/opublicas/DataSet-Obras-Publicas*.xlsx
  sheet: first
  header_row: 1
  encoding: utf-8
  granularity: 1 fila = 1 registro de obra (con su último avance reportado) por snapshot
  snapshot_date_extraction:
    from: file_name
    pattern: DataSet-Obras-Publicas\s+(\d{2})-(\d{2})-(\d{4})\.xlsx
    format: DD-MM-YYYY
    example: DataSet-Obras-Publicas 01-07-2026.xlsx
    on_failure: skip_file
  duplicate_headers:
    note: Resolver por posición. El perfil muestra el segundo monto como .1, sufijo generado por pandas; comprobar
      encabezados físicos del Excel.
    affected_positions:
    - 43
    - 46
  validity:
    snapshot_date_from_inclusive: '2026-07-01'
    basis: Fecha de la foto extraída del nombre del archivo; confirmar estructura de cada archivo posterior.
  profiling:
    file: DataSet-Obras-Publicas 01-07-2026.xlsx
    rows: 191180
    columns: 97
    note: Encabezados y tipos observados en el resultado de profiling proporcionado; source_position es 1-based
      y source es el nombre leído por pandas.
target:
  layer: staging
  schema: public
  entity: sa_obras_publicas_infobras
  natural_key_candidate:
  - codigo_infobras
  - fecha_foto
  - ano_avance
  - mes_avance
  natural_key_status: por validar (no definido en el pipeline actual)
  naming_convention: snake_case_es
  flag_prefix: flg_
  count_prefix: n_
load:
  strategy: snapshot_replace
  partition_key: fecha_foto
  steps:
  - Eliminar registros del destino con fecha_foto = fecha del archivo
  - Insertar registros transformados en lotes
  batch_size: 1000
  idempotent: true
  atomicity: per_batch
  on_batch_error: retry_row_by_row
  error_handling:
    reject_policy: log_and_continue
    log_fields:
    - column
    - value
    - python_type
    - error_message
  unmapped_columns_policy:
    source_missing_column: warn_and_load_null
    target_missing_column: warn_and_skip
  observations:
  - 'El DELETE y los INSERT usan commits distintos: un fallo intermedio deja el snapshot parcial. Recomendable envolver
    en una única transacción o usar tabla temporal + swap.'
  status: Propuesta heredada del mapping anterior; la selección de versión y su ejecución deben implementarse y
    validarse en el ETL.
conventions:
  null_representation: 'NULL'
  boolean_true_values:
  - si
  - sí
  - s
  - '1'
  - true
  - t
  - y
  - 'yes'
  boolean_false_values:
  - 'no'
  - '0'
  - false
  - f
  - n
  boolean_unknown: 'NULL'
  date_input_format: dayfirst (dd/mm/yyyy)
  date_unparseable: 'NULL'
  decimal_separator_output: .
  integer_out_of_range: 'NULL'
  integer_non_integral: 'NULL'
transformations:
- id: TRF_NONE
  description: Copia directa sin modificación.
- id: TRF_AMOUNT_SPACE_TO_DECIMAL
  description: 'Normaliza números cuyo separador decimal viene como espacio (ej. "1205065 23" -> 1205065.23; "S/1
    002 000 00" -> 1002000.00).

    '
  rules:
  - 'Si ya es numérico: se conserva.'
  - Vacío/nulo -> NULL.
  - Eliminar prefijo 'S/' (insensible a mayúsculas).
  - El ÚLTIMO espacio es el separador decimal; los demás espacios y comas son separadores de miles y se eliminan.
  - 'Sin espacios: eliminar comas y convertir.'
  - Si falla la conversión -> NULL + warning.
  output_type: decimal
- id: TRF_DATE_DAYFIRST
  description: Parseo a fecha con día primero; valores inválidos -> NULL.
  output_type: date
- id: TRF_BOOLEAN_SI_NO
  description: Mapeo de Sí/No (y variantes) a booleano según conventions.
  output_type: boolean
- id: TRF_INTEGER_STRICT
  description: 'Limpia espacios/comas, acepta solo enteros (o flotantes enteros) dentro del rango del tipo destino;
    en otro caso NULL.

    '
  output_type: integer
- id: TRF_FORCE_STRING
  description: Fuerza tipo texto (preserva ceros a la izquierda / evita inferencia numérica).
  output_type: string
- id: TRF_ID_INTEGER_TO_STRING
  description: Para valores numéricos enteros, convertir a texto sin sufijo .0; conservar textos y ceros iniciales,
    sin redondear valores fraccionarios. Nulo o numérico no entero -> NULL y advertencia.
  output_type: string
audit_columns:
- target: fecha_foto
  type: date
  nullable: false
  derivation: Fecha extraída del nombre del archivo (source.snapshot_date_extraction).
  description: Fecha lógica del snapshot; clave de partición y de reemplazo.
  active: true
- target: nombre_archivo
  type: string
  nullable: false
  derivation: Nombre del archivo fuente.
  description: 'Linaje: archivo de origen.'
  active: false
- target: fecha_creacion
  type: timestamp
  nullable: false
  derivation: DEFAULT en la base de datos (now).
  description: Momento de carga.
  active: false
- target: usuario_creacion
  type: string
  nullable: false
  derivation: DEFAULT en la base de datos (current_user).
  description: Usuario que ejecutó la carga.
  active: false
